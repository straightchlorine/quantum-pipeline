# Solver -> Kafka (KRaft + Plantext) with Confluent schema registry.
#
# Prerequisites:
# - Docker with Compose v2
#
# Run from repo root:
#   docker compose -f examples/kafka-plaintext.yml up \
#   --build \
#   --abort-on-container-exit \
#   --exit-code-from quantum-pipeline quantum-pipeline
#
# For a GPU run it requires:
# - NVIDIA GPU
# - nvidia-container-toolkit
# - replace the 'quantum-pipeline' in command above with 'quantum-pipeline-gpu'
#
# Full teardown:
#   docker compose -f examples/kafka-plaintext.yml down -v

x-solver: &solver
  restart: "no"
  environment:
    KAFKA_SERVERS: kafka:9092
    SCHEMA_REGISTRY_URL: http://schema-registry:8081
  volumes:
    - ./gen:/usr/src/quantum_pipeline/gen
  depends_on:
    kafka:
      condition: service_healthy
    schema-registry:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:${KAFKA_VERSION:-4.2.0}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      CLUSTER_ID: quantum-example-kafka-id-01
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  schema-registry:
    image: confluentinc/cp-schema-registry:${SCHEMA_REGISTRY_VERSION:-8.2.0}
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "--fail", "-s", "http://localhost:8081/subjects"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

  quantum-pipeline:
    !!merge <<: *solver
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
    command: ["--file", "data/molecules.json", "--molecule-index", "0", "--max-iterations", "5", "--kafka"]

  quantum-pipeline-gpu:
    !!merge <<: *solver
    profiles: [gpu]
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu
    command: ["--file", "data/molecules.json", "--molecule-index", "0", "--max-iterations", "5", "--kafka", "--gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
