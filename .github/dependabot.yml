# pdm.lock is the source of truth; Dependabot cannot read it, so pip is not watched here.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - patch
          - minor
      major:
        update-types:
          - major
    labels:
      - ci
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - /docker
      - /docker/airflow
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels:
      - docker
    open-pull-requests-limit: 5
    ignore:
      # CUDA 13 drops the Pascal cards.
      # TODO: introduce a proper cloud image, installing full gpu support for modern cards
      - dependency-name: nvidia/cuda
        update-types:
          - version-update:semver-major
      # Airflow 3.1.8 and Spark 4.0.2 (matching the GPU host) are held
      # TODO: test more modern versions of each
      - dependency-name: apache/airflow
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: apache/spark
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # CPU and GPU images stay on Python 3.12 / Ubuntu 24.04 LTS
      # (the GPU venv is copied between stages built on the same Python)
      - dependency-name: python
        update-types:
          - version-update:semver-minor
      - dependency-name: ubuntu
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
