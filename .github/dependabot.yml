# pdm.lock is the source of truth.
# Dependabot cannot read or update it, so the pip entry below watches docker/requirements.txt.
# It's a hashed export of the lock, from which the Dockerfiles install from.
version: 2

updates:
  - package-ecosystem: pip
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - patch
          - minor
      major:
        update-types:
          - major
    reviewers:
      - straightchlorine
    labels:
      - dependencies
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - patch
          - minor
      major:
        update-types:
          - major
    reviewers:
      - straightchlorine
    labels:
      - ci
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - /docker
      - /docker/airflow
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    reviewers:
      - straightchlorine
    labels:
      - docker
    open-pull-requests-limit: 5
    ignore:
      # CUDA 13 drops the Pascal cards.
      - dependency-name: nvidia/cuda
        update-types:
          - version-update:semver-major
      # Airflow majors need the DAG migration.
      - dependency-name: apache/airflow
        update-types:
          - version-update:semver-major
