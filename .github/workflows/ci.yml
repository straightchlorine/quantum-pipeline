name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12 and PDM
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        with:
          python-version: "3.12"

      - name: Cache PDM packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pdm
          key: ${{ runner.os }}-pdm-3.12-${{ hashFiles('pdm.lock') }}
          restore-keys: ${{ runner.os }}-pdm-3.12-

      - name: Install project from the lock
        # --frozen-lockfile stops the lockfile being rewritten against pyproject
        # --check fails if the lockfile is stale
        run: pdm install --check --frozen-lockfile -G dev

      - name: Lint with ruff
        run: pdm run ruff check .

      - name: Type-check with mypy
        run: pdm run mypy quantum_pipeline/

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # pdm.lock targets Python >=3.12 only:
        # 3.10 and 3.11 resolve older deps, so those install from the pyproject.
        include:
          - python-version: "3.10"
            pip: true
          - python-version: "3.11"
            pip: true
    env:
      PY: ${{ matrix.pip && 'python -m' || 'pdm run' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }} and PDM
        if: ${{ !matrix.pip }}
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Set up Python ${{ matrix.python-version }}
        if: ${{ matrix.pip }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project from the pyproject ranges
        if: ${{ matrix.pip }}
        run: python -m pip install ".[dev]"

      - name: Cache PDM packages
        if: ${{ !matrix.pip }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pdm
          key: ${{ runner.os }}-pdm-${{ matrix.python-version }}-${{ hashFiles('pdm.lock') }}
          restore-keys: ${{ runner.os }}-pdm-${{ matrix.python-version }}-

      - name: Install project from the lock
        if: ${{ !matrix.pip }}
        # --frozen-lockfile stops the lockfile being rewritten against pyproject
        # --check fails if the lockfile is stale
        run: pdm install --check --frozen-lockfile -G dev

      - name: Run tests
        id: tests
        run: >
          $PY pytest tests/ -n auto -m "not integration and not slow" --timeout=120 --cov=quantum_pipeline --cov-report=term-missing -v
      - name: Coverage check
        # skip when an earlier step failed and the tests never ran
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: |
          $PY coverage combine 2>/dev/null || true
          $PY coverage report --fail-under=50
