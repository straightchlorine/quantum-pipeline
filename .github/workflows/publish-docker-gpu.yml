name: Publish GPU Image

# Called by the Release workflow (publish.yml) on a tag push, which attaches
# the SBOM to the GitHub release itself. Run it by hand to rebuild the image
# of an existing release.

on:
  workflow_call:
    inputs:
      version:
        description: "Release tag to build"
        required: true
        type: string
      cuda_arch:
        description: "CUDA compute capabilities to compile for (empty = the Dockerfile's multi-generation default)"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to build (empty = latest tag on master)"
        required: false
        type: string
        default: ""
      cuda_arch:
        description: "CUDA compute capabilities to compile for (empty = the Dockerfile's multi-generation default)"
        required: false
        type: string
        default: ""

env:
  DOCKERHUB_IMAGE: docker.io/${{ github.repository }}
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: publish-gpu
  cancel-in-progress: false

jobs:
  build-gpu-image:
    name: Build GPU image
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: docker
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="$GITHUB_REF_NAME"
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(git describe --tags --abbrev=0 origin/master)
          fi
          git rev-parse --verify "refs/tags/$VERSION" >/dev/null
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building GPU image for release $VERSION"

      - name: Check out release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git checkout "refs/tags/$VERSION"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: false # slow, the above already frees ~30 GB
          swap-storage: false # keep swap - the aer compile is memory-hungry

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-gpu
            type=raw,value=gpu

      - name: Build and push GPU image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile.gpu
          push: true
          build-args: ${{ inputs.cuda_arch && format('CUDA_ARCH={0}', inputs.cuda_arch) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-gpu
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-gpu,mode=max

      - name: Verify digest is present
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: test -n "$DIGEST"

  sign-and-attest:
    name: Sign & attest GPU image
    needs: [build-gpu-image]
    runs-on: ubuntu-latest
    environment: docker
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign images (keyless OIDC)
        env:
          DIGEST: ${{ needs.build-gpu-image.outputs.digest }}
        run: |
          cosign sign --yes \
            "${DOCKERHUB_IMAGE}@${DIGEST}" \
            "${GHCR_IMAGE}@${DIGEST}"

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.GHCR_IMAGE }}@${{ needs.build-gpu-image.outputs.digest }}
          format: spdx-json
          artifact-name: quantum-pipeline-${{ needs.build-gpu-image.outputs.version }}-gpu.spdx.json
          upload-release-assets: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance (GHCR)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ needs.build-gpu-image.outputs.digest }}
          push-to-registry: true

      # storing in attestation store
      - name: Attest build provenance (Docker Hub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/${{ github.repository }}
          subject-digest: ${{ needs.build-gpu-image.outputs.digest }}

  # Manual rebuilds only: on a release, publish.yml attaches the SBOM when it
  # creates the GitHub release, which happens after this workflow finishes.
  attach-sbom:
    name: Attach SBOM to release
    if: github.event_name == 'workflow_dispatch'
    needs: [build-gpu-image, sign-and-attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Retrieve the GPU image SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quantum-pipeline-${{ needs.build-gpu-image.outputs.version }}-gpu.spdx.json
          path: sbom/

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-gpu-image.outputs.version }}
        run: gh release upload "$VERSION" --repo "$GITHUB_REPOSITORY" --clobber sbom/*

  scan-gpu-image:
    name: Scan GPU image
    needs: [build-gpu-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout (for .trivyignore)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Smoke-test the image
        env:
          IMAGE: ${{ env.GHCR_IMAGE }}@${{ needs.build-gpu-image.outputs.digest }}
        run: |
          docker run --rm --entrypoint bash "$IMAGE" -c '
            set -euo pipefail
            aer_dir="$(python -c "import os, qiskit_aer; print(os.path.dirname(qiskit_aer.__file__))")"
            if find "$aer_dir" -name "*.so" -exec ldd {} + | grep "not found"; then exit 1; fi
            python -m quantum_pipeline --help > /dev/null'

      # Informational: a scanner failure does not block the release.
      - name: Scan GPU image
        id: scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE }}@${{ needs.build-gpu-image.outputs.digest }}
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "0"
          timeout: 15m

      - name: Upload report to Security tab
        if: steps.scan.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy-gpu
